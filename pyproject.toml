[project]
name = "reading-atlas"
version = "0.1.0"
description = "Turn your bookmarks and notes into an explorable semantic map."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.6",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
fetch = ["trafilatura>=1.12"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
atlas = "reading_atlas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reading_atlas"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
